<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Evolve</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:#000;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none; user-select:none; }
  canvas { position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  canvas[hidden] { display:none; }

  .bar {
    position:fixed; left:50%; transform:translateX(-50%);
    display:flex; gap:5px; padding:5px; z-index:10;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    border-radius:999px;
    backdrop-filter:blur(16px) saturate(1.4);
    -webkit-backdrop-filter:blur(16px) saturate(1.4);
    transition:opacity .5s ease;
  }
  .bar[hidden] { display:none; }
  body.hidechrome .bar { opacity:0; pointer-events:none; }

  /* ===== setup overlay ===== */
  #setup {
    position:fixed; inset:0; z-index:20; overflow-y:auto;
    display:flex; align-items:center; justify-content:center;
    padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right))
            max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
    background:rgba(4,4,10,.72);
    backdrop-filter:blur(20px) saturate(1.3);
    -webkit-backdrop-filter:blur(20px) saturate(1.3);
  }
  #setup[hidden] { display:none; }
  #card {
    width:min(420px,100%);
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    border-radius:24px; padding:22px 20px 20px;
  }
  #card h1 { font-size:22px; font-weight:600; letter-spacing:.02em; color:#fff; margin-bottom:22px; }
  #card .lbl { font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase;
    color:rgba(255,255,255,.45); margin-bottom:9px; }
  #card nav { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; }
  #card nav button, #start {
    appearance:none; border:1px solid rgba(255,255,255,.14); cursor:pointer;
    border-radius:14px; font-size:14px; font-weight:600; letter-spacing:.02em;
    color:rgba(255,255,255,.75); background:rgba(255,255,255,.05);
    min-height:52px; padding:0 16px; flex:1 1 auto; white-space:nowrap;
  }
  /* 4 durations flex-wrap to 3 + a lone full-width "90 min"; a 2x2 grid is even */
  #card nav#mins { display:grid; grid-template-columns:1fr 1fr; }
  #card nav button[aria-pressed="true"] { color:#0b0b12; background:rgba(255,255,255,.92); border-color:transparent; }
  #start { width:100%; min-height:60px; margin-top:4px; font-size:16px;
    color:#0b0b12; background:rgba(255,255,255,.92); border-color:transparent; }
  #hint { text-align:center; font-size:11px; color:rgba(255,255,255,.35); margin-top:14px; }

  #dock {
    bottom:max(18px,env(safe-area-inset-bottom));
    width:min(560px, calc(100vw - 28px));
    align-items:center; gap:10px; padding:10px 14px; border-radius:20px;
  }
  #play { appearance:none; border:0; cursor:pointer; flex:0 0 auto;
    width:34px; height:34px; border-radius:999px; font-size:13px;
    color:#0b0b12; background:rgba(255,255,255,.92); }
  #p { flex:1 1 auto; accent-color:#fff; height:26px; }
  #readout { flex:0 0 auto; width:6ch; text-align:right;
    font-variant-numeric:tabular-nums; font-size:11px; letter-spacing:.06em;
    color:rgba(255,255,255,.65); }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="c2d" hidden></canvas>

<div id="setup">
  <div id="card">
    <h1>Evolve</h1>
    <p class="lbl">Duration</p>
    <nav id="mins" aria-label="Duration">
      <button data-min="1">1 min</button>
      <button data-min="15">15 min</button>
      <button data-min="30" aria-pressed="true">30 min</button>
      <button data-min="60">60 min</button>
      <button data-min="90">90 min</button>
    </nav>
    <p class="lbl">Scene</p>
    <nav id="tabs" aria-label="Scene">
      <button data-scene="0" aria-pressed="true">Metaballs</button>
      <button data-scene="1" aria-pressed="false">Galaxy</button>
      <button data-scene="2" aria-pressed="false">Tide</button>
      <button data-scene="3" aria-pressed="false">Crystal</button>
    </nav>
    <button id="start">Start</button>
    <p id="hint">Double-tap the animation to come back here</p>
  </div>
</div>

<div class="bar" id="dock" hidden>
  <button id="play" aria-label="Play">&#9654;</button>
  <input id="p" type="range" min="0" max="2000" value="0">
  <span id="readout">0%</span>
</div>

<script>
// ===== the one knob =====
// Every scene is a pure function of p (0..1) + t (seconds, motion only).
// The scrubber sets p by hand; Play sweeps it over SWEEP seconds so you can
// judge the curve, not just the endpoints.  ?sweep=15 to iterate faster.
// Double-tap the canvas to hide the UI and judge it clean.
//
// The clock is NOT clamped at the source. praw = (now-startedAt)/targetMs runs
// past 1, and three scalars fall out of it:
//   p       min(praw,1)  — growth. Every scene's structure is a function of this.
//   arrive  0..1, reaching 1 exactly AT p=1 and holding forever after. This is
//           the "arrived" look. It ramps over the last SETTLE of the session, so
//           completion is a state you settle into, never an event that fires —
//           walk in at 100% or an hour later and you see the same thing.
//   over    0..1 where 1 = a full extra period overdue. Slow, additive drift on
//           top of the arrived look, so "just done" reads different from "very
//           overdue" without anything having to die or dim.
//
// Normal path: a timed session. Start records the wall clock, and every frame
// sets praw = elapsed/target — so growth is driven by the clock, not by frames,
// and a backgrounded WebView can't fall behind.
let praw = 0, p = 0, arrive = 0, over = 0, playing = false;
// ponytail: knobs via query string, same as index.html — ?fps=30&scale=0.5 for
// the phone (quarter the fragment work), ?mins=1 for a fast test session,
// ?dev=1 to get the scrubber back for desktop iteration.
const qs = new URLSearchParams(location.search);
const DEV   = qs.get('dev') === '1';
const FPS   = Math.max(1, +qs.get('fps') || 60);
const SCALE = Math.min(1, Math.max(0.25, +qs.get('scale') || 1));
const SWEEP  = +(qs.get('sweep') || 60);
const SETTLE = 0.10;   // last 10% of the session is the settle into "arrived"
const OVER_SPAN = 1;   // praw 1..2 -> over 0..1

const ease = x => x*x*(3-2*x);            // smoothstep
const late = x => Math.pow(ease(x), 1.5); // biased late: most change in the last third
const lerp = (a,b,x) => a + (b-a)*x;
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
// remap a sub-range of p to 0..1 — lets a scene layer several overlapping arcs
const stage = (a,b) => ease(clamp01((p-a)/(b-a)));

const slider  = document.getElementById('p');
const readout = document.getElementById('readout');
const playBtn = document.getElementById('play');
const glCanvas  = document.getElementById('gl');
const c2dCanvas = document.getElementById('c2d');

let scene = 0;
const tabs = document.getElementById('tabs');
function setScene(n){
  scene = n;
  [...tabs.querySelectorAll('button')].forEach(b => b.setAttribute('aria-pressed', +b.dataset.scene === n));
  glCanvas.hidden  = n > 1;      // 0 metaballs and 1 galaxy are both WebGL
  c2dCanvas.hidden = n < 2;
}
tabs.addEventListener('click', e => {
  const b = e.target.closest('button'); if(b) setScene(+b.dataset.scene);
});
// the one place praw turns into the three scalars. Console: setP(1.35)
function setP(v){
  praw = Math.max(0, Math.min(1+OVER_SPAN, v));
  p = Math.min(1, praw);
  arrive = ease(clamp01((praw-(1-SETTLE))/SETTLE));
  over = clamp01((praw-1)/OVER_SPAN);
  slider.value = praw*1000;
  // past 100% the readout switches to overtime and goes amber; the slider's
  // midpoint IS completion, so the bar carries the rest of the context
  readout.textContent = over > 0 ? '+'+Math.round(over*100)+'%' : Math.round(p*100)+'%';
  readout.style.color = over > 0 ? 'rgba(255,186,110,.9)' : 'rgba(255,255,255,.65)';
}
slider.addEventListener('input', () => { setP(slider.value/1000); playing = false; playBtn.innerHTML = '&#9654;'; });
playBtn.addEventListener('click', () => {
  playing = !playing;
  if(playing && praw >= 1+OVER_SPAN) setP(0);
  playBtn.innerHTML = playing ? '&#10073;&#10073;' : '&#9654;';
});
if(DEV) document.getElementById('dock').hidden = false;

// ===== session =====
const setup = document.getElementById('setup');
const minsNav = document.getElementById('mins');
let mins = +qs.get('mins') || 30;
let startedAt = 0, targetMs = 0, running = false;
function setMins(n){
  mins = n;
  [...minsNav.querySelectorAll('button')].forEach(b => b.setAttribute('aria-pressed', +b.dataset.min === n));
}
setMins(mins);
if(qs.has('scene')) setScene(Math.max(0, Math.min(3, +qs.get('scene') || 0)));
minsNav.addEventListener('click', e => {
  const b = e.target.closest('button'); if(b) setMins(+b.dataset.min);
});
document.getElementById('start').addEventListener('click', () => {
  setup.hidden = true;
  startedAt = performance.now();
  targetMs = mins*60000;
  running = true;
  setP(0);
});
// Back to setup — the only control during a session. Bound to the canvases, not
// the window: with a window-level dblclick listener Chrome swallows the second of
// two quick taps anywhere, so picking a duration and a scene in fast succession
// silently lost the second tap.
for(const c of [glCanvas, c2dCanvas]) c.addEventListener('dblclick', () => {
  if(DEV){ document.body.classList.toggle('hidechrome'); return; }
  running = false;
  setup.hidden = false;
});

// ===== WebGL: metaballs =====
const gl = glCanvas.getContext('webgl', {antialias:true});
const MAX = 14;

const fsrc = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2  uRes;
uniform float uTime, uP, uArrive, uOver;
uniform int   uCount;
uniform vec3  uBalls[${MAX}];

float hash(vec2 v){ return fract(sin(dot(v, vec2(12.9898,78.233)))*43758.5453); }

void main(){
  vec2 uv = gl_FragCoord.xy / uRes.xy;
  float aspect = uRes.x / uRes.y;
  vec2 q = vec2(uv.x*aspect, uv.y);
  float e = uP*uP*(3.0-2.0*uP);          // eased p

  float f = 0.0;
  for(int i=0;i<${MAX};i++){
    if(i>=uCount) break;
    vec2 d = q - uBalls[i].xy;
    f += (uBalls[i].z*uBalls[i].z) / (dot(d,d)+0.0006);
  }
  float edge = smoothstep(0.80,1.00,f);
  float rim  = edge * pow(max(1.0-abs(f-1.0),0.0),8.0);
  float glow = clamp(f,0.0,2.0);
  vec3 col;

  // NEON — evolution is density; palette warms and the halo swells so a
    // glance reads progress without counting blobs.
    vec3 bg = mix(vec3(0.012,0.010,0.028), vec3(0.05,0.02,0.075), e);
    float w = 0.5+0.5*sin(uTime*0.18 + uv.x*3.2 + uv.y*2.4);
    vec3 c = mix(vec3(0.20,0.75,1.0), vec3(1.0,0.15,0.55), mix(0.15,0.85,e)*w + 0.15*e);
    // ARRIVED: the emission temperature turns over — magenta/cyan neon anneals
    // into gold. Applied to c, so rim, halo and core all warm together and the
    // change is readable at a glance without counting anything.
    // (Collapsing the hot-core threshold instead was tried and flattens the whole
    // interior to one featureless cream mass — the thing the radius curve exists
    // to prevent. Change the light, not the fill.)
    c = mix(c, mix(c, vec3(1.0,0.66,0.26), 0.78), uArrive);
    // late: a second, hotter core colour blooms inside the thickest field
    vec3 hot = mix(c, vec3(1.0,0.85,0.75), smoothstep(1.4,2.6,f)*e);
    col  = bg;
    col += c*pow(glow,1.7)*mix(0.07,0.16,e);
    col  = mix(col, hot*0.9, edge);
    col += rim*c*mix(0.5,1.05,e);
    // and a steady halo that doesn't care where the balls happen to be — the
    // cue has to survive the mass drifting under it, or it reads as a flicker
    col += c*pow(glow,1.1)*0.035*uArrive;
    // OVERDUE: the surrounding air keeps warming. Nothing dims; the room just
    // gets slowly redder, which is what tells you it's been done a long while.
    col += vec3(0.055,0.012,0.030)*uOver;
    col += vec3(0.30,0.10,0.16)*pow(glow,2.5)*0.05*uOver;

  vec2 v = uv-0.5;
  col *= 1.0 - dot(v,v)*0.35;
  // dither: big smooth gradients band badly on the phone's panel
  col += (hash(gl_FragCoord.xy) - 0.5)/255.0*1.5;
  gl_FragColor = vec4(col,1.0);
}`;

const vsrc = `attribute vec2 pos; void main(){ gl_Position = vec4(pos,0.0,1.0); }`;
function compile(type,src){
  const s = gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER,vsrc));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER,fsrc));
gl.linkProgram(prog); gl.useProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));

// the full-screen triangle, shared with the galaxy's background pass
const fsBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, fsBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const aloc = gl.getAttribLocation(prog,'pos');
const U = n => gl.getUniformLocation(prog,n);
const uRes=U('uRes'), uTime=U('uTime'), uP=U('uP'),
      uBalls=U('uBalls'), uCount=U('uCount'), uArrive=U('uArrive'), uOver=U('uOver');

const balls = [];
for(let i=0;i<MAX;i++){
  const a = Math.random()*6.2832;
  balls.push({ x:0.5+(Math.random()-0.5)*0.5, y:0.5+(Math.random()-0.5)*0.5,
    vx:Math.cos(a), vy:Math.sin(a),
    r: i<2 ? 0.09+Math.random()*0.03 : 0.045+Math.random()*0.03,
    spin:(Math.random()-0.5)*0.22 });
}
const ballData = new Float32Array(MAX*3);
let glAspect = 1;

function drawGL(dt, t){
  // the galaxy scene shares this context, so state is set per draw, not once
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, fsBuf);
  gl.enableVertexAttribArray(aloc); gl.vertexAttribPointer(aloc,2,gl.FLOAT,false,0,0);
  gl.viewport(0,0,glCanvas.width,glCanvas.height);
  gl.uniform2f(uRes, glCanvas.width, glCanvas.height);
  const count = Math.max(1, Math.round(lerp(1, MAX, late(p))));
  // radius shrinks as count grows, or 14 balls fuse into one featureless mass at p=1
  const rs = lerp(1.5, 0.6, late(p)) * (1 + 0.28*over);
  for(let i=0;i<count;i++){
    const b = balls[i];
    const ca = Math.cos(b.spin*dt), sa = Math.sin(b.spin*dt);
    const vx = b.vx*ca - b.vy*sa; b.vy = b.vx*sa + b.vy*ca; b.vx = vx;
    b.x += b.vx*0.055*dt; b.y += b.vy*0.055*dt;
    if(b.x<0.02){b.x=0.02;b.vx=Math.abs(b.vx);} if(b.x>0.98){b.x=0.98;b.vx=-Math.abs(b.vx);}
    if(b.y<0.02){b.y=0.02;b.vy=Math.abs(b.vy);} if(b.y>0.98){b.y=0.98;b.vy=-Math.abs(b.vy);}
    ballData[i*3]   = b.x * glAspect;
    ballData[i*3+1] = b.y;
    ballData[i*3+2] = b.r * rs;
  }
  gl.uniform3fv(uBalls, ballData);
  gl.uniform1i(uCount, count);
  gl.uniform1f(uTime, t); gl.uniform1f(uP, p);
  gl.uniform1f(uArrive, arrive); gl.uniform1f(uOver, over);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

// ===== 2D scenes =====
const ctx = c2dCanvas.getContext('2d');
let W=0, H=0, PX=1;   // PX = device pixel scale; canvas is sized in device px

// deterministic per-index randoms so scrubbing backwards is stable
const rnd = (i,s) => { const x = Math.sin(i*127.1 + s*311.7)*43758.5453; return x - Math.floor(x); };

// soft additive blob — the cheap bloom that makes 2D canvas stop looking like 2D canvas
function haze(x,y,r,rgb,a){
  if(a <= 0.002) return;
  const g = ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,   `rgba(${rgb},${a})`);
  g.addColorStop(0.45,`rgba(${rgb},${a*0.35})`);
  g.addColorStop(1,   `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.fillRect(x-r,y-r,r*2,r*2);
}

// --- GALAXY (WebGL) ------------------------------------------------------
// Rewritten off 2D canvas. The old one could afford 2800 fillRects inside a
// small centred oval, which is exactly why three quarters of the screen was
// empty. This is one background quad + one POINTS draw of ~40k sprites, so the
// galaxy can be BIGGER THAN THE FRAME — the disc runs off all four edges and
// the frame is a window onto something larger, not a specimen in a jar.
//
// Structure is a DENSITY WAVE, not a pinwheel. Stars orbit differentially
// (inner faster) while the two-arm pattern rotates slowly and rigidly, and
// stars are *crowded toward* the pattern rather than glued to it. So the arms
// survive a 90-minute session instead of winding themselves shut, and you can
// watch stars stream through an arm and out the other side.
//
// Dust lanes are not drawn — they can't be, everything here is additive. They
// are an absorption term: the same spiral phase, offset by ~0.7 rad so the lane
// lands on the INNER edge of the arm where it belongs, dimming and reddening
// both the background glow and every star behind it. Dark structure is what
// makes bright structure look bright; without this there are no blacks inside
// the galaxy at all and the arms read as stipple.
const GAL = { disc: 34000, hii: 260, glob: 150, field: 5200, bright: 6 };
const GN = GAL.disc + GAL.hii + GAL.glob + GAL.field + GAL.bright;
const ARMS = 2.0, PITCH = 0.42;   // 2 arms = grand design; PITCH = how open they are

// One interleaved buffer, 8 floats/star: aA(r, phase, bind, born) aB(size, warm, kind, seed).
// kind: 0 disc star, 1 HII region, 2 deep field, 3 foreground star, 4 globular.
// For kinds 2/3 aA.xy is a screen uv instead — those don't belong to the galaxy.
const gdata = new Float32Array(GN*8);
{
  let gi = 0;
  const put = (...v) => { gdata.set(v, gi*8); gi++; };
  for(let i=0;i<GAL.disc;i++) put(
    Math.pow(rnd(i,1), 0.55),                 // r — density must fall outward
    rnd(i,2)*6.2832,                          // orbital phase
    // ~18% never bind to an arm. That permanent haze is the whole reason the
    // finish doesn't resolve into two clean threads.
    rnd(i,10) < 0.18 ? rnd(i,11)*0.30 : 0.45+0.55*rnd(i,11),
    i/GAL.disc,                               // born
    // A POWER LAW, not a uniform band. Thousands you can barely see and a few
    // dozen that punch — a flat size range makes 34k sprites read as one pen.
    Math.min(6.0, 0.42*Math.pow(Math.max(rnd(i,6),0.004), -0.42)),
    rnd(i,4), 0, rnd(i,7));
  // HII regions: the pink knots that make a real galaxy photo pop. They CLUMP —
  // three in a knot then a long gap — because evenly spaced ones read as a
  // necklace of beads. Long-tailed sizes, and not quite glued to the crest.
  for(let i=0;i<GAL.hii;i++) put(
    0.16 + Math.pow(rnd(i,31),0.8)*0.88,
    Math.floor(rnd(i,32)*22)/22*6.2832 + (rnd(i,36)-0.5)*0.35,
    0.80 + 0.20*rnd(i,37), 0,
    // capped just under the 110px gl_PointSize clamp: anything above ~37 here
    // rendered at exactly the same size anyway, so the top of the old range
    // bought nothing and cost fill. Area goes as size² — this halves the HII
    // fill, which was the single largest thermal contributor in the frame.
    5 + Math.pow(rnd(i,33),2.6)*30, rnd(i,34), 1, rnd(i,35));
  // Globular clusters: a spheroidal halo that ignores the disc plane entirely.
  // They're what fills the two corners the inclined disc can't reach, and they
  // belong to the galaxy instead of being more anonymous background.
  for(let i=0;i<GAL.glob;i++) put(
    Math.pow(rnd(i,61),0.35)*1.6, rnd(i,62)*6.2832, 0, 0,
    3 + rnd(i,63)*6, 0.6+0.4*rnd(i,64), 4, rnd(i,65));
  for(let i=0;i<GAL.field;i++) put(
    rnd(i,41), rnd(i,42), 0, 0, 0.45+rnd(i,43)*0.85, rnd(i,44), 2, rnd(i,45));
  // Six near stars with diffraction spikes — the tell that sells a photograph.
  // Six, not fourteen: evenly scattered they compete with the galaxy for the eye.
  // HAND-PLACED, not rnd(): with only six samples the draw matters, and rnd is
  // deterministic, so a bad draw is a bad composition in every session forever —
  // the first version put two of them right on top of the nucleus. Kept clear of
  // the centre, and weighted into the two corners the inclined disc can't reach.
  for(const [x,y,sz] of [[0.86,0.83,74],[0.72,0.92,26],[0.14,0.17,58],
                         [0.28,0.09,22],[0.90,0.32,34],[0.10,0.68,20]])
    put(x, y, 0, 0, sz, rnd(gi,54), 3, rnd(gi,55));
}

// Value-noise texture, built once. fbm from two texture taps costs a fraction
// of fract(sin()) octaves in the fragment shader, and the phone is the target.
const noiseTex = (() => {
  const N = 256, img = new Uint8Array(N*N*4);
  const lat = f => {                       // one smooth channel at lattice size f
    const g = Array.from({length:f*f}, (_,i) => rnd(i, f));
    const at = (x,y) => g[((y%f)+f)%f*f + ((x%f)+f)%f];
    return (u,v) => {
      const x = u*f, y = v*f, xi = Math.floor(x), yi = Math.floor(y);
      const fx = ease(x-xi), fy = ease(y-yi);
      return lerp(lerp(at(xi,yi), at(xi+1,yi), fx), lerp(at(xi,yi+1), at(xi+1,yi+1), fx), fy);
    };
  };
  const ch = [lat(16), lat(32), lat(64)];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const o = (y*N+x)*4;
    for(let c=0;c<3;c++) img[o+c] = ch[c](x/N, y/N)*255;
    img[o+3] = 255;
  }
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,N,N,0,gl.RGBA,gl.UNSIGNED_BYTE,img);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
  // Mipmaps are not optional here. The shader samples this at frequencies that
  // put a noise cell below a pixel at the disc's outer edge, and unmipped that
  // aliases into a fixed herringbone hatch lying across the dust lanes.
  // texture2D in a fragment shader picks the level from implicit derivatives,
  // so this costs nothing and needs no extension.
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  return tex;
})();

// Shared between both shaders so the stars and the glow they sit in can never
// disagree about where an arm is.
const GAL_COMMON = `
uniform vec2  uRes;
uniform vec3  uGeo;    // cx, cy, R (device px)
uniform vec4  uEnv;    // t, p, arrive, over
uniform vec2  uInc;    // cos(inclination), sin(inclination)
uniform float uRot, uForm;
#define ARMS ${ARMS.toFixed(1)}
#define PITCH ${PITCH.toFixed(2)}
#define PAT 0.006
#define DUSTOFF 1.45   // ~0.72 rad in theta: the lane sits on the arm's inner edge
vec2 grot(vec2 v, float a){ float c=cos(a), s=sin(a); return vec2(v.x*c-v.y*s, v.x*s+v.y*c); }
// spiral phase: 0 on an arm crest. log(r) is what makes it logarithmic.
// The m=1 term is what stops the two arms from being exact 180-degree copies of
// each other. Perfect two-fold symmetry is the loudest "a machine drew this"
// tell there is — no real grand-design spiral has it. It co-rotates with the
// pattern so the asymmetry never looks pinned to the screen.
float gphase(float r, float th, float t){
  return th - log(max(r,0.04))/PITCH - t*PAT + 0.33*cos(th - t*PAT);
}
`;

const galVsrc = `
attribute vec4 aA, aB;
${GAL_COMMON}
uniform float uPx;
varying vec4 vCol; varying vec3 vK;   // kind class, seed, spike falloff
void main(){
  float t = uEnv.x, p = uEnv.y, arrive = uEnv.z, over = uEnv.w;
  float kind = aB.z, seed = aB.w, form = uForm;
  vec2 sp; vec3 col; float a, ps = aB.x*uPx;
  vK = vec3(0.0, seed, 4.5);

    // are most of what keeps the corners from being dead black. These are the
    // only stars allowed to twinkle — scintillation is an atmosphere effect and
    // nothing 50 million light years away is doing it.
    sp = aA.xy*uRes;
    col = mix(vec3(0.70,0.80,1.0), vec3(1.0,0.84,0.62), aB.y*aB.y);
    float tw = 0.86 + 0.08*sin(t*0.9+seed*57.0) + 0.06*sin(t*2.37+seed*23.0);
    a = (0.16+0.34*aB.y)*tw;
    if(kind > 2.5){
      vK.x = 2.0;
      vK.z = 4.5/(aB.x/28.0);                       // long spikes on big stars only
      // they arrive with the session instead of sitting on top of it from frame 1
      a = (0.55+0.35*aB.y)*tw*(0.35+0.65*smoothstep(0.10,0.60,p));
    }

    float r = aA.x, th, rr, w = 0.0, dust = 0.0, h;

      // an object drifting. Still visibly turning if you watch for a minute.
      th = aA.y + t*0.030/(0.30+r);

      float amp = form*mix(0.20, 1.30, aA.z);        // per-star arm adherence
      th -= amp*sin(ARMS*gphase(r,th,t))/ARMS;       // crowd toward the crest
      rr = r*mix(1.70,1.0,form)*(1.0 - 0.05*amp*cos(ARMS*gphase(r,th,t)));

      w *= 0.72 + 0.50*cos(th - t*PAT);              // one arm brighter (see gphase)
      // phase-perturbed per star, not amplitude-modulated: as a multiplier this
      // chopped the lane into dashes at the sprite level the same way it did in
      // the background pass
      dust = pow(max(0.5+0.5*cos(ARMS*(ph + DUSTOFF + 0.45*(fract(seed*31.7)-0.5))),1e-4), 6.0)

      // disc thickness: a puffed spheroid that flattens as it forms
      h = (fract(seed*97.13)-0.5)*mix(0.60,0.055,form)*exp(-rr*0.8);

      float bulge = exp(-rr*4.2);

        // arms dark-gapped at p=1 but also extinguished the entire early star

        // gas. High floor early = a diffuse proto-swarm; low floor late = arms.
        * mix(mix(0.55,0.20,form), 1.0, w*form)
        * (1.0-0.88*dust)
        * (0.30+0.70*exp(-rr*1.05))                  // disc fades outward
        * clamp(aB.x*0.75, 0.35, 2.4)                // big stars are also brighter
        // the few stars that exist early have to carry the frame on their own,
        // so they burn brighter before the disc has anything else to show

        a = smoothstep(0.42,0.85,p)*(0.10+0.10*aB.y)*(0.35+0.65*w)*(1.0-0.6*dust);

  // those are in OUR galaxy and have no business ageing with the session.

}`;

const galFsrc = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec4 vCol; varying vec3 vK;
void main(){
  vec2 q = gl_PointCoord-0.5;
  float d = length(q)*2.0, a;
  if(vK.x > 0.5 && vK.x < 1.5) a = exp(-d*d*3.2);              // soft nebular puff
  else {
    a = exp(-d*d*9.0) + 0.26*exp(-d*3.4);                      // core + halo
    if(vK.x > 1.5){                                            // diffraction spikes
      // rotated per star — six identical axis-aligned crosses read as stickers
      float c = cos(vK.y*1.5708), s = sin(vK.y*1.5708);
      vec2 e = abs(vec2(q.x*c-q.y*s, q.x*s+q.y*c));
      a += 0.6*exp(-min(e.x,e.y)*140.0)*exp(-max(e.x,e.y)*vK.z);
    }
  }
  gl_FragColor = vec4(vCol.rgb*a*vCol.a, 1.0);
}`;

const galBgFsrc = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
${GAL_COMMON}
uniform sampler2D uNoise;
// Each octave is ROTATED as well as scaled. Without that, three axis-aligned
// value-noise lattices stack into a visible square grid — the giveaway that the
// clouds came out of a texture.
float fbm(vec2 x){
  mat2 M = mat2(0.80,0.60,-0.60,0.80);
  float f  = texture2D(uNoise, x*0.5).r*0.52;      x = M*x*2.1;
        f += texture2D(uNoise, x*0.5).g*0.30;      x = M*x*2.3;
        f += texture2D(uNoise, x*0.5).b*0.18;
  return f;
}
float hash(vec2 v){ return fract(sin(dot(v, vec2(12.9898,78.233)))*43758.5453); }
void main(){
  float t = uEnv.x, arrive = uEnv.z, over = uEnv.w, form = uForm;
  vec2 fc = gl_FragCoord.xy;
  vec2 d  = grot(fc-uGeo.xy, -uRot)/uGeo.z;
  vec2 dp = vec2(d.x, d.y/uInc.x);            // back to the disc plane
  // the cloud is TWICE the size before it forms and visibly falls inward. Without
  // this the "formless" state has the same silhouette as the arrived one and
  // nothing ever collapses.
  float r = length(dp)*mix(0.55,1.0,form), th = atan(dp.y, dp.x);
  float ph = gphase(r, th, t);
  float armw = pow(max(0.5+0.5*cos(ARMS*ph),1e-4), 2.0);
  armw *= 0.72 + 0.50*cos(th - t*PAT);        // and one arm is brighter than the other
  // higher-frequency when unformed (a ragged cloud), low and smooth when settled.
  // Screen space, like the mottle — sampled in dp this came out as diagonal
  // brush strokes, which is the single most artificial thing the eye can spot.
  float n = fbm(d*mix(1.5,0.75,form) + vec2(t*0.004,0.0));
  float mot = fbm(d*2.9 + vec2(1.7,0.4));
  // The lane's PHASE wanders, its amplitude does not. Multiplying noise into a
  // band that pow(...,10) has made a few pixels wide just chops it into dashes;
  // perturbing where the band *is* makes it meander, which is what dust does.
  float dust = pow(max(0.5+0.5*cos(ARMS*(ph + DUSTOFF + 0.45*(mot-0.5))),1e-4), 6.0);

  // The unresolved light of the disc. Without this the galaxy is a pile of dots;
  // with it the dots sit IN something.
  float disc = exp(-r*1.9);
  // a real BAR, not a fat ellipse: 3.4:1 with blunted ends
  float bl   = length(vec2(dp.x/3.4, dp.y));
  float bar  = exp(-pow(bl,1.6)*4.2);
  float glow = disc*(0.16+1.15*armw*form)*mix(0.45,1.0,form) + bar*0.62*form;
  // Mottle it. Unresolved starlight is not an airbrush — a smooth analytic
  // falloff reads as a soapy grey sheet that swamps the sprites sitting in it.
  // The floor is radius-dependent: the inner disc mottles hard so the sprites
  // have somewhere dark to be bright against, the outer disc stays smooth.
  glow *= mix(0.30, 0.62, smoothstep(0.15,0.70,r)) + 0.55*mot;
  glow *= 1.0 - 0.93*dust*form*smoothstep(0.05,0.32,r);
  // TWO thin lanes flanking the bar's axis (note the nested abs) — the real
  // signature of an SBb. One wide smear down the spine just dims the bar.
  // confined by a TIGHTER envelope than the bar's own glow — at the bar's own
  // 3.4:1 extent the two lanes ran the full width of the disc and read as a
  // pair of scratches on the print
  float bd = exp(-abs(abs(dp.y - dp.x*0.18) - 0.095)*26.0) * exp(-pow(bl,1.6)*11.0);
  glow *= 1.0 - 0.78*bd*smoothstep(0.02,0.10,r)*form;

  // three colour poles, not two: gold bulge, neutral mid-disc, cold blue rim.
  // A straight violet->gold ramp is why the whole thing used to be one hue.
  vec3 gcol = mix(mix(vec3(0.72,0.80,1.00), vec3(1.0,0.78,0.42), exp(-r*2.2)),
                  vec3(0.24,0.38,0.80), smoothstep(0.20,0.85,r));
  vec3 col = glow*gcol*0.30;
  // The nucleus TIGHTENS rather than ignites: broad and dim at p=0, small and
  // clipping-white at p=1. Gated on form it was simply off for the first third
  // of the session, which left the early frame with no focal point at all — and
  // a screensaver spends far more minutes near low p than at p=1.
  col += exp(-r*mix(2.2,13.0,form))*vec3(1.0,0.87,0.64)*mix(0.42,0.85,form);
  // nebula: colour arrives before structure, so mid-p is a glowing cloud. It is
  // the PRE-formation state and mostly burns off — at p=1 the picture should be
  // starlight, with pink only in the discrete HII knots.
  // Early it is broad and has NO spiral in it — structure is the thing p is
  // supposed to be delivering, so the cloud must not arrive already organised.
  // one tap, not an fbm: hz is sampled at ~1 feature across the whole frame and
  // only drives a colour selector, so octaves below the sampling scale are waste
  float hz = texture2D(uNoise, fc/uRes.y*0.85 + vec2(0.0,t*0.002)).r;
  float neb = n*n*exp(-r*mix(2.6,2.1,form))
            * mix(1.0, pow(max(0.30+0.70*armw,1e-4),2.0), form);
  // three poles, driven by a noise field, so the cloud is never one flat purple:
  // cold teal in the thin parts, violet in the body, magenta where the arms are
  vec3 nc = mix(vec3(0.10,0.22,0.46), vec3(0.42,0.14,0.54), smoothstep(0.25,0.75,hz));
  nc = mix(nc, vec3(0.72,0.22,0.42), armw*form);
  col += neb*nc*mix(0.85,0.32,form);
  // a halo that is ROUND ON SCREEN, not in the disc plane — the inclined falloff
  // leaves two clean black wedges perpendicular to the arm axis otherwise
  // ...and it's MOTTLED. A smooth radial wash at the corner reads as a vignette
  // artifact; a mottled one reads as an outer envelope the galaxy actually has.
  float halo = exp(-length(d)*0.85);
  col += halo*(0.45+0.95*mot)*vec3(0.042,0.048,0.088)*mix(0.5,1.0,form);
  // faint everywhere-haze: no corner of this is allowed to be dead black
  col += hz*vec3(0.022,0.017,0.048);
  col += vec3(0.002,0.002,0.006);
  // ARRIVED: an outer envelope, not a global brightness step. Over 90 minutes a
  // gain bump is invisible; an envelope the galaxy didn't have before is not.
  // tighter than the standing halo on purpose: at the halo's own 0.85 falloff
  // this lifted the whole sky back to lavender, which reads as the exposure
  // changing rather than as the galaxy gaining an envelope
  col += exp(-length(d)*1.7)*vec3(0.070,0.090,0.190)*arrive;
  col += exp(-r*1.3)*vec3(0.11,0.038,0.020)*over;     // OVERDUE: the air warms
  vec2 v = fc/uRes-0.5; col *= 1.0-dot(v,v)*0.24;     // light — it darkens the corners
  // Toe and shoulder, and let it clip. Without this nothing in the frame is
  // black and nothing is white — the whole image sat in the middle of the
  // histogram, which is the difference between an exposure and a painting.
  // exponent ABOVE 1 — pow(c,0.92) brightens everything below 1 and lifted the
  // whole sky to lavender, the exact opposite of the intent. >1 crushes the
  // low end; the gain then pushes the bar and nucleus into the top decile.
  col = pow(col, vec3(1.18))*1.40;
  // dither. 2.5/255 not 1.5: the dark side of a dust lane is a very shallow
  // gradient and at 1.5 it contoured into scalloped bands along the lane
  col += (hash(fc)-0.5)/255.0*2.5;
  gl_FragColor = vec4(col,1.0);
}`;

function link(vs, fs){
  const pr = gl.createProgram();
  gl.attachShader(pr, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(pr, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
  return pr;
}
const galProg = link(galVsrc, galFsrc);
const galBgProg = link(vsrc, galBgFsrc);
const galBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, galBuf);
gl.bufferData(gl.ARRAY_BUFFER, gdata, gl.STATIC_DRAW);
const galLoc = {
  aA: gl.getAttribLocation(galProg,'aA'), aB: gl.getAttribLocation(galProg,'aB'),
  u: n => gl.getUniformLocation(galProg, n), b: n => gl.getUniformLocation(galBgProg, n),
};
const galBgPos = gl.getAttribLocation(galBgProg,'pos');

// Inclination + roll. The point of the roll is that the major axis runs corner
// to corner instead of lying flat across a portrait screen.
const INC = 1.06;                       // radians from face-on
function galUniforms(pr, t, get){
  gl.uniform2f(get('uRes'), glCanvas.width, glCanvas.height);
  gl.uniform3f(get('uGeo'), glCanvas.width*0.5, glCanvas.height*0.47,
                            Math.max(glCanvas.width, glCanvas.height)*0.68);
  gl.uniform4f(get('uEnv'), t, p, arrive, over);
  gl.uniform2f(get('uInc'), Math.cos(INC), Math.sin(INC));
  gl.uniform1f(get('uRot'), -0.62);
  gl.uniform1f(get('uForm'), late(p));
}

function galaxy(t){
  gl.viewport(0,0,glCanvas.width,glCanvas.height);
  gl.disable(gl.BLEND);
  gl.useProgram(galBgProg);
  gl.bindBuffer(gl.ARRAY_BUFFER, fsBuf);
  gl.enableVertexAttribArray(galBgPos);
  gl.vertexAttribPointer(galBgPos,2,gl.FLOAT,false,0,0);
  galUniforms(galBgProg, t, galLoc.b);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, noiseTex);
  gl.uniform1i(galLoc.b('uNoise'), 0);
  gl.drawArrays(gl.TRIANGLES,0,3);

  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(galProg);
  gl.bindBuffer(gl.ARRAY_BUFFER, galBuf);
  gl.enableVertexAttribArray(galLoc.aA); gl.vertexAttribPointer(galLoc.aA,4,gl.FLOAT,false,32,0);
  gl.enableVertexAttribArray(galLoc.aB); gl.vertexAttribPointer(galLoc.aB,4,gl.FLOAT,false,32,16);
  galUniforms(galProg, t, galLoc.u);
  gl.uniform1f(galLoc.u('uPx'), PX);
  gl.drawArrays(gl.POINTS, 0, GN);
  gl.disableVertexAttribArray(galLoc.aB);
  gl.disable(gl.BLEND);
}
// --- TIDE ----------------------------------------------------------------
// Two arcs that OVERLAP on purpose. The tide comes in and stops at mid-screen
// (past that the sea eats the sky and there is nowhere left for a sunrise to
// happen); the sky starts warming while the water is still rising, so the
// second idea is already under way before the first one finishes. No cut.
// No sine-wave polygons anywhere — those read as clip art. A sea is a dark
// plane, a lit horizon, and a column of specular glints; the sky does the rest.

// Sky as five colour stops interpolated between three whole palettes. One
// gradient per frame; the entire night->dawn->morning arc is a mix() on this
// table, which is why the sky never has a moment that looks composited.
const SKY_AT = [0, 0.40, 0.66, 0.86, 1];
const SKY_N  = [[2,4,12],[5,8,24],[10,16,38],[18,28,54],[30,42,70]];        // night
const SKY_W  = [[12,18,74],[52,42,116],[146,68,118],[236,120,86],[255,198,124]]; // dawn
const SKY_D  = [[28,76,160],[70,120,196],[138,168,214],[226,192,158],[255,226,176]]; // morning
const mix3 = (a,b,x) => [a[0]+(b[0]-a[0])*x, a[1]+(b[1]-a[1])*x, a[2]+(b[2]-a[2])*x];
const css  = c => `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
const rgbs = c => `${c[0]|0},${c[1]|0},${c[2]|0}`;
// a stretched radial. Clouds are wide and flat and a circle never reads as one
function hazeE(x,y,rx,ry,rgb,a){
  ctx.save(); ctx.translate(x,y); ctx.scale(1, ry/rx);
  haze(0,0,rx,rgb,a); ctx.restore();
}
// Cloud strata: packed toward the horizon (pow biases low), each drifting at
// its own rate so the bank never reads as one rigid sheet sliding past.
// Wide and THIN (th caps at 0.09): a stratum whose height approaches its width
// is a puff, and puffs floating over an ocean read as the blobs this scene was
// built to replace.
// Eight, not thirteen: at 13 the band was a stack of lens streaks. And the
// thinnest are gone (th floors at 0.045) — below that an ellipse is a scratch.
const CLOUDS = Array.from({length:8}, (_,i) => ({
  h: 0.015 + Math.pow(rnd(i,71),2.0)*0.50,
  x: rnd(i,72),
  w: 0.22 + rnd(i,73)*0.42,
  th: 0.045 + rnd(i,74)*0.055,
  v: (0.0025 + rnd(i,75)*0.006) * (rnd(i,76) > 0.5 ? 1 : -1),
}));

function tide(t){
  // Arc 1: the flood, done by p=0.62 and then held.
  const flood = ease(clamp01(p/0.62));
  const lv    = lerp(0.10, 0.50, flood) + 0.045*over;
  const yTop  = H*(1-lv);
  // Arc 2: light first (it starts at 0.38, inside the flood), disc much later.
  const light = stage(0.38, 0.95);
  const rise  = stage(0.60, 1.00) + 0.30*arrive + 1.1*over;
  const sunX  = W*0.655, moonX = W*0.24;
  const sunR  = Math.min(W,H)*0.050;
  // low sun flattens — refraction. Costs one lerp and is the detail that makes
  // people say a render "looks photographed"
  const squash = lerp(0.78, 1.0, clamp01(rise*1.3));
  const sunY  = yTop + sunR*1.25 - sunR*2.5*rise;
  const skyC  = SKY_N.map((n,i) => mix3(mix3(n, SKY_W[i], light), SKY_D[i], over*0.85));
  const hor   = skyC[4];

  // ---- sky
  const sky = ctx.createLinearGradient(0,0,0,yTop);
  SKY_AT.forEach((a,i) => sky.addColorStop(a, css(skyC[i])));
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,yTop+2);

  ctx.globalCompositeOperation = 'lighter';
  // stars: they come out as the night deepens, then the dawn takes them
  // starts at 140, not 20: the deep-night frame has the least to look at, so it
  // cannot also be the least starry. Dawn still takes them, via the pow() below.
  const ns = Math.round(lerp(140,260,p));
  for(let i=0;i<ns;i++){
    // squared, not linear: stars are gone long before the sky is bright, and a
    // star field surviving into a pink sky is the tell of a fake dawn
    ctx.globalAlpha = (0.20+0.6*rnd(i,8)) * (0.6+0.4*Math.sin(t*1.3+i)) * Math.pow(1-light,2.2);
    ctx.fillStyle = '#dfe8ff';
    ctx.fillRect(rnd(i,9)*W, rnd(i,7)*yTop*0.96, 1.3*PX, 1.3*PX);
  }
  ctx.globalAlpha = 1;

  // ---- moon: owns the first half, then washes out in the growing light.
  // It sets as the sun rises — the two are never both the subject.
  const moonR = Math.min(W,H)*0.032;
  const moonY = yTop*lerp(0.40, 0.14, light);
  // A clean exit, not a fade to a smudge. Held at ~0.05 the moon is too faint to
  // read as a moon and too present not to look like screen burn; the arc is the
  // moon HANDING the sky to the sun, and a hand-off means leaving.
  const mv = Math.pow(1-light,1.8)*lerp(0.35,1.0,ease(p))
           * (1 - ease(clamp01((light-0.55)/0.23)));
  if(mv > 0.01){
    haze(moonX, moonY, moonR*16, '140,175,255', 0.050*mv);
    haze(moonX, moonY, moonR*5.0, '190,210,255', 0.28*mv);
    ctx.globalAlpha = 0.85*mv;
    ctx.fillStyle = '#f2f5ff';
    ctx.beginPath(); ctx.arc(moonX, moonY, moonR, 0, 6.2832); ctx.fill();
    // terminator: one offset disc of the sky behind it. A flat white circle is a
    // hole punched in the sky; a phase is the cheapest thing that makes it a body.
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 0.30*mv;
    ctx.fillStyle = css(mix3(skyC[1], skyC[2], 0.5));
    ctx.beginPath(); ctx.arc(moonX - moonR*0.62, moonY - moonR*0.30, moonR*0.94, 0, 6.2832); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 1;
  }

  // ---- the light itself, before there is anything to see it come from.
  // Three nested hazes: the whole eastern sky, the glow, then the core.
  haze(sunX, yTop, W*1.30, '255,150,80', 0.11*light);
  haze(sunX, sunY + sunR*0.6, W*0.52, '255,168,86', 0.20*light);
  haze(sunX, sunY, sunR*7.5, '255,206,140', 0.30*light*light);

  // ---- crepuscular rays. One radial gradient, N wedges, one fill — the fan is
  // essentially free. The hard part is restraint: an even fan of equal wedges
  // spanning the sky is a rising-sun FLAG, not weather. So: irregular angles and
  // widths, a narrow arc, alpha low enough to be felt and not seen, and the
  // gradient dies at 0.55 of the diagonal so nothing reaches the zenith. They
  // also fade as the sun clears the water — shafts are a low-sun phenomenon.
  const rayK = light*light*(1 - 0.75*clamp01(rise));
  if(rayK > 0.02){
    const L = Math.max(W,H)*0.62;
    // inner stop at 2.5R, not 0.9R: the apex must never converge to a point, or
    // the narrowest wedge is a 1px line running the height of the sky
    const g = ctx.createRadialGradient(sunX,sunY,sunR*2.5,sunX,sunY,L);
    // A wedge has hard straight sides no matter how it is coloured, so the only
    // safe place for this effect is below the threshold where the eye resolves
    // an edge. Felt, not seen.
    g.addColorStop(0,   `rgba(255,226,178,${0.030*rayK})`);
    g.addColorStop(0.35,`rgba(255,204,150,${0.013*rayK})`);
    g.addColorStop(1,   'rgba(255,190,140,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    for(let i=0;i<5;i++){
      // rnd on the angle too — evenly spaced shafts are the giveaway
      const a = -1.57 + (rnd(i,80)-0.5)*2.0 + Math.sin(t*0.045 + i*2.1)*0.04;
      // half-width FLOORED. Below ~0.045 rad the wedge is pixel-thin over most
      // of its length and reads as a scratch on the screen, at any alpha — a
      // hard edge against a smooth gradient always resolves.
      const w = 0.045 + rnd(i,81)*0.05;
      ctx.moveTo(sunX, sunY);
      ctx.lineTo(sunX + Math.cos(a-w)*L, sunY + Math.sin(a-w)*L);
      ctx.lineTo(sunX + Math.cos(a+w)*L, sunY + Math.sin(a+w)*L);
    }
    ctx.fill();
  }

  // ---- the disc. Drawn BEFORE the water, so the sea hides the submerged half
  // and the sun genuinely comes UP OUT of it rather than fading in above it.
  if(rise > 0.005){
    const k = clamp01(rise*4);
    // bloom that hugs the limb. Without it the disc is a white sticker; the
    // blown-out skirt around the edge is most of what makes a sun look hot.
    haze(sunX, sunY, sunR*3.4, '255,232,186', 0.42*k);
    haze(sunX, sunY, sunR*1.55, '255,244,214', 0.40*k);
    ctx.save();
    ctx.translate(sunX, sunY); ctx.scale(1, squash);
    ctx.globalAlpha = k;
    // one gradient, not two flat fills: a low sun is white at the centre and
    // reddens toward the limb, and that fall-off is what stops it being a sticker
    const d = ctx.createRadialGradient(0,0,0, 0,0,sunR);
    d.addColorStop(0,   '#fffdf4');
    d.addColorStop(0.72,'#ffeec0');
    d.addColorStop(1,   '#ffd48e');
    ctx.fillStyle = d;
    ctx.beginPath(); ctx.arc(0,0,sunR,0,6.2832); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // ---- cloud strata. Dark body in source-over (a cloud is a denser patch of
  // sky, never a hole in it), warm rim in lighter and only on the BOTTOM edge —
  // underlighting is the entire difference between a lit cloud and a painted one.
  const body = rgbs(mix3(mix3([14,20,40], [58,36,62], light), [120,130,155], over*0.8));
  ctx.globalCompositeOperation = 'source-over';
  const drawn = [];
  for(const c of CLOUDS){
    const cy = yTop - yTop*c.h;
    const cw = W*c.w, ch = cw*c.th;
    const cx = (((c.x + t*c.v) % 1 + 1) % 1)*W*1.5 - W*0.25;
    // Thinned out with altitude. The stacked-lobe trick rescues the low bank,
    // but a high stratum is a lone thin ellipse cut off by the frame edge — a
    // lens streak. Deletion by exponent: the top few effectively vanish.
    const alt = Math.exp(-c.h*1.8);
    hazeE(cx, cy, cw, ch, body, (0.20 + 0.30*light)*alt);
    // a second, smaller lobe riding on top and offset along the length. One
    // extra ellipse buys a lumpy top edge, which is the whole difference between
    // vapour and a lens streak — a single ellipse is always a smear.
    hazeE(cx + cw*0.18, cy - ch*0.5, cw*0.6, ch*0.7, body, (0.16 + 0.24*light)*alt);
    drawn.push({cx,cy,cw,ch,h:c.h});
  }
  ctx.globalCompositeOperation = 'lighter';
  for(const c of drawn){
    // lit hardest near the sun and near the horizon, which is what gives the
    // bank depth instead of eight equally-bright stripes
    const lit = light*light * Math.exp(-Math.abs(c.cx-sunX)/W*1.5) * Math.exp(-c.h*2.0);
    if(lit < 0.004) continue;
    // the rim must be SHORTER than the body, or the underlight is just a second
    // streak parked below the first
    hazeE(c.cx, c.cy + c.ch*0.55, c.cw*0.55, c.ch*0.6,  '255,150,80',  0.46*lit);
    hazeE(c.cx, c.cy + c.ch*0.80, c.cw*0.35, c.ch*0.24, '255,226,180', 0.55*lit);
  }

  // ---- water: it reflects the sky it sits under, so its top stop is derived
  // from the horizon colour rather than being its own hand-tuned palette.
  ctx.globalCompositeOperation = 'source-over';
  // The sea reflects the sky DIRECTLY ABOVE IT — which away from the sun is the
  // violet mid-sky, not the gold at the horizon. Tinting the whole sea with the
  // horizon colour is what turned it into a sheet of brown fog; the gold belongs
  // only in the road, and the road is additive.
  const sea = mix3(skyC[2], hor, 0.30);
  // The near water has to be allowed OUT of midnight. With a hardcoded black
  // floor, a full-morning sky sat on a night sea — a contradiction the eye
  // catches instantly, and it made the bottom 40% of every frame dead.
  const day = clamp01(light*0.35 + over);
  const wat = ctx.createLinearGradient(0,yTop,0,H);
  wat.addColorStop(0,    css(mix3(sea,[10,16,34],0.10)));
  // steeper falloff at 0.09 (0.58 -> 0.45) so the sheet has a value change in it
  // and doesn't read as painted drywall
  wat.addColorStop(0.09, css(mix3(sea,[8,14,30],0.45)));
  wat.addColorStop(0.40, css(mix3(sea,[3,7,18],lerp(0.90,0.62,clamp01(light*0.5+over)))));
  // BLUE, not neutral: [16,24,44] mixed down landed on aluminium, and a morning
  // sea that isn't blue is the one thing nobody forgives
  wat.addColorStop(1,    css(mix3([1,2,6],[12,30,62],day)));
  ctx.fillStyle = wat; ctx.fillRect(0,yTop,W,H-yTop);

  ctx.globalCompositeOperation = 'lighter';
  // Swell: distance compresses the spacing, which is the only cue that says
  // "this plane recedes" — without it the sea is a flat wall of gradient.
  // BROKEN INTO SEGMENTS: a crest running the full width of the screen is a
  // CRT scanline, not a wave. Same fill count, and the gaps give the empty
  // middle of the sea something to be.
  // Only the far half. Down here the crests are wide enough to read and the
  // spacing is compressed enough to mean something; in the near field the same
  // marks were faint horizontal scratches on an otherwise clean plane. Drawing
  // them at invisible alpha everywhere was the one non-choice.
  ctx.fillStyle = css(mix3([170,200,255],[255,214,170],light));
  for(let i=0;i<18;i++){
    const u = Math.pow((i+0.6)/18, 2.3);
    if(u > 0.5) break;
    const y = yTop + u*(H-yTop) + Math.sin(t*0.25 + i*1.7)*(H-yTop)*0.004;
    const h = Math.max(1, u*2.6*PX);
    for(let k=0;k<5;k++){
      const sw = W*(0.12 + rnd(i*7+k,63)*0.28);
      ctx.globalAlpha = 0.05*(1-u*0.55)*lerp(0.4,1,ease(p))*(0.5+0.5*rnd(i*7+k,64));
      ctx.fillRect(rnd(i*7+k,65)*(W-sw), y, sw, h);
    }
  }
  ctx.globalAlpha = 1;
  // horizon: a soft band, never a drawn line. Elliptical and THIN — a circular
  // haze this wide bleeds halfway down the sea and reads as fog.
  hazeE(W*0.5, yTop, W*0.95, (H-yTop)*0.05, '120,160,220', 0.10*lerp(0.3,1,ease(p)));
  hazeE(sunX,  yTop, W*0.40, (H-yTop)*0.10,
        rgbs(mix3([200,215,255],[255,196,126],light)), 0.28*lerp(0.3,1,ease(p)));

  // ---- the path. Same cone twice: cool under the moon while it owns the sky,
  // gold under the sun once it doesn't. One routine, two lights.
  const path = (x, colour, k) => {
    if(k < 0.01) return;
    const ng = Math.round(lerp(70, 200, ease(p)));
    ctx.fillStyle = colour;
    for(let i=0;i<ng;i++){
      const u  = Math.pow(rnd(i,31), 1.8);            // packed near the horizon
      const y  = yTop + u*(H-yTop);
      const dz = u + 0.04;
      const cone = W*(0.06 + 0.55*dz);
      const off  = (rnd(i,32)-0.5)*cone
                 + Math.sin(t*0.6 + i*0.7)*cone*0.06; // slow lateral swim
      const fall = Math.exp(-Math.pow(off/(cone*0.55),2));
      const w = (1.2 + 15*dz*rnd(i,33)) * PX;
      const h = Math.max(1, 3.0*dz*PX);
      // Slow, and PHASED BY DISTANCE (u*6), so the shimmer travels down the road
      // as a wave. Independent per-glint flicker at ~1.1rad/s is noise-frequency:
      // it is exactly what made this field read as video static.
      const flick = 0.35 + 0.65*Math.pow(Math.abs(Math.sin(t*0.35 + u*6 + i*0.4)), 2.5);
      const a = fall*flick*k*Math.pow(1-u,1.6);
      ctx.globalAlpha = a*0.25;                       // soft underlay: caught light
      ctx.fillRect(x + off - w*1.5, y - h*0.5, w*3, h*2);
      ctx.globalAlpha = a;                            // then the hard core
      ctx.fillRect(x + off - w/2, y, w, h);
    }
    ctx.globalAlpha = 1;
  };
  // tripled early: moonlight on black water is the ONLY thing the night frame
  // has to show, and at 0.10 it was invisible
  path(moonX, '#cfe0ff', lerp(0.30,0.45,ease(p))*(1-light));
  path(sunX,  '#ffdca8', 0.50*light*(1+0.5*arrive));

  // ARRIVED: the scattered glints fill in behind into one continuous column —
  // the path stops being a scatter and becomes a road — and the sea picks up a
  // sheen at the horizon. Tuned up hard: at half these values p=0.88 and p=1.00
  // were indistinguishable on the phone, which fails the point of an arrival
  // state. Hazes, not a per-frame gradient; the shape is a cone either way.
  // The column follows the light, so it is under the sun by the time it lands.
  const px = lerp(moonX, sunX, clamp01(light*1.4));
  const pc = rgbs(mix3([170,200,255],[255,190,120],light));
  // Partly driven by `light` as well, so the sun owns a reflection the moment it
  // is up rather than only once the session lands — the road forms with the sun.
  haze(px, yTop + (H-yTop)*0.12, W*0.20, pc, 0.16*light + 0.20*arrive);
  // the bridge. Without it these two don't overlap mid-column and the gap reads
  // as a dark wedge — the brightest thing in the sky appearing to cast a shadow.
  haze(px, yTop + (H-yTop)*0.28, W*0.30, pc, 0.10*light + 0.14*arrive);
  haze(px, yTop + (H-yTop)*0.50, W*0.44, pc, 0.08*light + 0.12*arrive);
  hazeE(W*0.5, yTop + (H-yTop)*0.04, W*1.10, (H-yTop)*0.10, pc, 0.06*light + 0.09*arrive);

  // a sparse scatter of glints away from the path so the sea isn't empty
  // Gated on `light` and width-capped: a lone hard 16px dash on black water is
  // not a glint, it's a dead pixel — and there is nothing for it to reflect at
  // night anyway.
  ctx.fillStyle = css(mix3([190,215,255],[255,220,180],light));
  for(let i=0;i<Math.round(lerp(30,120,p));i++){
    const u = Math.pow(rnd(i,41), 1.6);
    // Structural, not a tuned falloff: a lone hard rect on smooth near water is
    // not a glint, it's a stuck pixel, and it only takes one. Fading it worked
    // at dawn and came back in full morning, when the brighter sea re-exposed
    // it — so the near field is simply excluded. The road owns that region.
    if(u > 0.7) continue;
    ctx.globalAlpha = 0.10*(0.4+0.6*Math.sin(t*0.9+i*1.7))*lerp(0.25,1,ease(p))*(0.3+0.7*light)*(1-u*u);
    ctx.fillRect(rnd(i,42)*W, yTop + u*(H-yTop), (2+8*u)*PX, Math.max(1,1.2*u*PX));
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

// --- CRYSTAL -------------------------------------------------------------
// Dendritic growth. Each segment carries a birth window; p reveals it.
// Birth times are NORMALISED to span the whole session — the generator's raw
// times bunched into 0..0.35, which is why growth used to stop around 60%.
const segs = [];
(function grow(x,y,ang,len,t0,depth){
  if(depth > 7 || len < 4) return;
  const t1 = t0 + 0.12/(depth*0.5+1);
  const x2 = x + Math.cos(ang)*len, y2 = y + Math.sin(ang)*len;
  segs.push({x,y,x2,y2,t0,t1,depth,ang});
  const seed = segs.length;
  grow(x2,y2,ang + (rnd(seed,11)-0.5)*0.25, len*0.82, t1, depth+1);
  if(rnd(seed,12) > 0.25) grow(x2,y2,ang + 0.62 + (rnd(seed,13)-0.5)*0.3, len*0.6, t1, depth+1);
  if(rnd(seed,14) > 0.25) grow(x2,y2,ang - 0.62 + (rnd(seed,15)-0.5)*0.3, len*0.6, t1, depth+1);
})(0,0,0,56,0,0);
// Re-time by SEGMENT COUNT, not by depth. Segment count grows ~2.5x per level,
// so a depth-linear schedule spends the whole session on a bare skeleton and
// dumps every fine branch in the last seconds. Giving each depth a slice of p
// proportional to how many segments it contains makes visible detail arrive at
// a steady rate — the finest level alone owns the back half of the session.
{
  const byDepth = [];
  for(const s of segs) byDepth[s.depth] = (byDepth[s.depth]||0) + 1;
  const edges = []; let acc = 0;
  for(let d=0; d<byDepth.length; d++){ edges[d] = acc/segs.length; acc += byDepth[d]; }
  edges.push(1);
  segs.forEach((s,i) => {
    const a = edges[s.depth], span = edges[s.depth+1] - a;
    s.t0 = a + rnd(i,51)*span*0.65;      // stagger inside the band, or it grows in lockstep
    s.t1 = s.t0 + span*0.35 + 0.008;
  });
}
const CRYST_ARMS = 6;
// Segments of the same depth share a colour and width, so they can go into one
// path: 6 arms x 8 depths = 48 strokes/frame instead of ~9000. (That naive
// version ran at 20fps on the phone.)
const byDepth = [];
let latticeR = 0;                              // extent, for the arrival halo
segs.forEach((s,i) => {
  (byDepth[s.depth] = byDepth[s.depth] || []).push(s);
  s.spark = s.depth > 3 && rnd(i,60) > 0.86;   // thin the tip sparkles too
  latticeR = Math.max(latticeR, Math.hypot(s.x2, s.y2));
});

function crystal(t){
  ctx.fillStyle = '#04050c'; ctx.fillRect(0,0,W,H);
  const cx = W/2, cy = H/2;
  // OVERDUE: it never stops accreting — the whole lattice keeps swelling and the
  // facets keep thickening. Growth, not a new behaviour, so it can't look like
  // a second act starting.
  const s = Math.min(W,H)/420 * lerp(0.42,0.95,ease(p)) * (1+0.10*over);
  const q = late(p);
  const spin = t*0.015;

  ctx.globalCompositeOperation = 'lighter';
  // cold ambient bloom behind the lattice, so it sits in something
  haze(cx,cy, Math.min(W,H)*lerp(0.25,0.62,ease(p)), '70,110,220', lerp(0.05,0.16,ease(p)));
  ctx.lineCap = 'round';

  const stroke = [], width = [];
  const hue = lerp(202,268,q) + 22*over;      // keeps drifting past violet while overdue
  for(let d=0; d<byDepth.length; d++){
    stroke[d] = `hsla(${hue - d*3},${lerp(60,88,q)}%,${lerp(48,74,q)}%,${lerp(0.30,0.85,q)})`;
    width[d]  = Math.max(0.5, (7-d)*0.55);
  }
  const facetFill = `hsla(${lerp(212,278,q)},90%,72%,${0.10*q})`;
  const facetLine = `hsla(${lerp(212,278,q)},95%,80%,${0.30*q})`;

  for(let a=0;a<CRYST_ARMS;a++){
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(a/CRYST_ARMS*6.2832 + spin);
    ctx.scale(s, s*(a%2 ? -1 : 1));                    // mirror alternate arms

    for(let d=0; d<byDepth.length; d++){
      let any = false;
      ctx.beginPath();
      for(const g of byDepth[d]){
        if(p <= g.t0) continue;
        const f = Math.min(1, (p-g.t0)/(g.t1-g.t0));
        ctx.moveTo(g.x, g.y);
        ctx.lineTo(lerp(g.x,g.x2,f), lerp(g.y,g.y2,f));
        any = true;
      }
      if(!any) break;                                   // deeper levels can't exist yet
      ctx.strokeStyle = stroke[d]; ctx.lineWidth = width[d]; ctx.stroke();
    }

    // hex facets thicken the trunk late — growth that continues after every
    // branch has already appeared
    ctx.beginPath();
    for(let d=0; d<=3 && d<byDepth.length; d++)
      for(const g of byDepth[d]){
        const fa = clamp01((p - g.t1)/0.45);
        if(fa <= 0) continue;
        const rad = (5.5-d)*2.2*fa*(1+0.45*over);
        for(let k=0;k<6;k++){
          const th = g.ang + k*1.0472;
          const px = g.x2 + Math.cos(th)*rad, py = g.y2 + Math.sin(th)*rad;
          k ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
        }
        ctx.closePath();
      }
    ctx.fillStyle = facetFill; ctx.fill();
    ctx.lineWidth = 0.6; ctx.strokeStyle = facetLine; ctx.stroke();

    // frost sparkle on finished tips — one path, shimmer phased per arm
    ctx.beginPath();
    for(let d=4; d<byDepth.length; d++)
      for(const g of byDepth[d]){
        if(!g.spark || p < g.t1) continue;
        ctx.moveTo(g.x2+1.3, g.y2);
        ctx.arc(g.x2, g.y2, 1.3, 0, 6.2832);
      }
    // arrived: the shimmer's floor comes up — the tips are lit, not blinking
    ctx.globalAlpha = 0.5*q*lerp(0.55+0.45*Math.sin(t*2 + a*1.7), 0.95, arrive*0.7);
    ctx.fillStyle = '#dff3ff'; ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // ARRIVED: a hexagonal aura closes through the lattice. Six arms only ever
  // implied that shape; making it visible is what reads as finished rather than
  // paused mid-growth — and it holds, so arriving late looks the same.
  // Soft and INSIDE the tips only. A crisp outline at the full extent reads as a
  // UI border drawn around the artwork — the one cheap-looking thing in the frame.
  if(arrive > 0.01){
    const hr = latticeR * s * 0.84;
    ctx.beginPath();
    for(let k=0;k<6;k++){
      const th = spin + k*1.0472;
      const px = cx + Math.cos(th)*hr, py = cy + Math.sin(th)*hr;
      k ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
    }
    ctx.closePath();
    // three widths at falling alpha instead of a blur filter: a single wide
    // stroke has hard sides and reads as a solid plate, and canvas blur is the
    // most expensive thing on this phone
    for(const [w,a] of [[46,0.016],[30,0.020],[16,0.026]]){
      ctx.strokeStyle = `hsla(${hue},80%,78%,${a*arrive})`;
      ctx.lineWidth = w*PX; ctx.stroke();
    }
  }
  haze(cx,cy, Math.min(W,H)*0.09*lerp(0.6,1.4,q), '220,240,255', lerp(0.10,0.30,q));
  ctx.globalCompositeOperation = 'source-over';
}

// ===== resize + loop =====
function resize(){
  const dpr = Math.min(devicePixelRatio||1, 2) * SCALE;
  PX = dpr;
  for(const c of [glCanvas, c2dCanvas]){
    c.width = Math.floor(innerWidth*dpr); c.height = Math.floor(innerHeight*dpr);
  }
  glAspect = glCanvas.width/glCanvas.height;
  gl.viewport(0,0,glCanvas.width,glCanvas.height);
  W = c2dCanvas.width; H = c2dCanvas.height;
  ctx.setTransform(1,0,0,1,0,0);
}
addEventListener('resize', resize); resize();

let last = performance.now();
let fps = 60;
// Motion clock, accumulated rather than read off `now`, so the arrival slowdown
// can't slew every angle at once (t*k jumps when k changes; a phase doesn't).
// Everything paced off it — rotation, twinkle, glint flicker — calms together,
// which is most of what "settled" feels like.
let mt = 0;
const MIN_DT = 1000/FPS - 1;  // -1ms slack so a 30fps cap isn't halved by vsync jitter
function frame(now){
  requestAnimationFrame(frame);
  if(now - last < MIN_DT) return;      // frame budget: skip, don't draw
  const dt = Math.min((now-last)/1000, 0.05); last = now;
  fps += (1/Math.max(dt,0.001) - fps)*0.05;

  if(running) setP((now - startedAt)/targetMs);
  else if(playing){
    setP(praw + dt/SWEEP);
    if(praw >= 1+OVER_SPAN){ playing = false; playBtn.innerHTML = '&#9654;'; }
  }
  const dts = dt * lerp(1, 0.45, arrive);
  mt += dts;
  const t = mt;

  if(scene === 0) drawGL(dts, t);
  else if(scene === 1) galaxy(t);
  else if(scene === 2) tide(t);
  else crystal(t);
}
requestAnimationFrame(frame);
</script>
</body>
