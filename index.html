<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Metaballs</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:#000;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  #gl { display:block; width:100vw; height:100vh; }

  .chrome {
    position:fixed; left:50%; bottom:max(22px,env(safe-area-inset-bottom));
    transform:translateX(-50%);
    display:flex; gap:6px; padding:6px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    border-radius:999px;
    backdrop-filter:blur(16px) saturate(1.4);
    -webkit-backdrop-filter:blur(16px) saturate(1.4);
    box-shadow:0 8px 30px rgba(0,0,0,.4);
    transition:opacity .6s ease;
    z-index:10;
  }
  .chrome button {
    appearance:none; border:0; cursor:pointer;
    padding:9px 15px; border-radius:999px;
    font-size:12px; font-weight:600; letter-spacing:.04em;
    color:rgba(255,255,255,.72); background:transparent;
    transition:background .25s, color .25s;
    white-space:nowrap;
  }
  .chrome button:hover { color:#fff; background:rgba(255,255,255,.08); }
  .chrome button[aria-pressed="true"] {
    color:#0b0b12; background:rgba(255,255,255,.92);
  }
  .chrome button:focus-visible { outline:2px solid rgba(255,255,255,.7); outline-offset:2px; }

  .hint {
    position:fixed; left:50%; top:20px; transform:translateX(-50%);
    color:rgba(255,255,255,.4); font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; pointer-events:none; z-index:10;
    transition:opacity .6s ease;
  }
  body.idle .chrome, body.idle .hint { opacity:0; }
  @media (prefers-reduced-motion:reduce){ .chrome,.hint{ transition:none; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="hint" id="hint">medium mix &middot; slow &amp; dreamy</div>
<nav class="chrome" id="chrome" aria-label="Style">
  <button data-style="0" aria-pressed="true">Neon glow</button>
  <button data-style="1" aria-pressed="false">Lava lamp</button>
  <button data-style="2" aria-pressed="false">Ink</button>
  <button data-style="3" aria-pressed="false">Oil slick</button>
</nav>

<script>
const canvas = document.getElementById('gl');

// Never fail to a silent black screen — show what went wrong.
function showError(msg){
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;'
    + 'justify-content:center;padding:28px;text-align:center;line-height:1.5;'
    + 'color:rgba(255,255,255,.85);font-size:13px;background:#0b0b12;z-index:20';
  el.textContent = msg;
  document.body.appendChild(el);
}

// --- UI wiring FIRST, so controls respond even if WebGL never starts ---
let style = 0;
const chrome = document.getElementById('chrome');
chrome.addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  style = +btn.dataset.style;
  [...chrome.querySelectorAll('button')].forEach(b=>
    b.setAttribute('aria-pressed', b===btn));
});
let idle;
function wake(){
  document.body.classList.remove('idle');
  clearTimeout(idle);
  idle = setTimeout(()=>document.body.classList.add('idle'), 3500);
}
['pointermove','pointerdown','keydown','touchstart'].forEach(ev=>
  addEventListener(ev, wake, {passive:true}));
wake();

const opts = { antialias:true, premultipliedAlpha:false };
const gl = canvas.getContext('webgl', opts) || canvas.getContext('experimental-webgl', opts);
if(!gl){ showError('This browser could not start WebGL, so the animation can’t run.'); throw new Error('no webgl'); }

const MAX = 12;
const COUNT = 10;

const vsrc = `
attribute vec2 pos;
void main(){ gl_Position = vec4(pos,0.0,1.0); }`;

const fsrc = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2  uRes;
uniform float uTime;
uniform int   uStyle;
uniform vec3  uBalls[${MAX}];   // x,y in aspect-space ; z = radius
uniform int   uCount;

// --- palette helpers ---
vec3 hue(float t){                       // smooth rainbow
  return 0.55 + 0.45*cos(6.2831853*(t + vec3(0.0,0.33,0.67)));
}

void main(){
  vec2 uv = gl_FragCoord.xy / uRes.xy;
  float aspect = uRes.x / uRes.y;
  vec2 p = vec2(uv.x*aspect, uv.y);

  float f = 0.0;
  for(int i=0;i<${MAX};i++){
    if(i>=uCount) break;
    vec3 b = uBalls[i];
    vec2 d = p - b.xy;
    f += (b.z*b.z) / (dot(d,d)+0.0006);
  }

  float edge = smoothstep(0.80, 1.00, f);          // solid surface
  float rim  = edge * pow(max(1.0-abs(f-1.0),0.0), 8.0);  // bright band at surface
  float glow = clamp(f, 0.0, 2.0);
  vec2  n    = vec2(p.x/aspect, p.y);              // 0..1 space for gradients

  vec3 col;

  if(uStyle==0){
    // NEON GLOW — violet ground, cyan↔magenta, saturated core + bright rim
    vec3 bg = vec3(0.035,0.02,0.06);
    float t = 0.5 + 0.5*sin(uTime*0.18 + n.x*3.2 + n.y*2.4);
    vec3 c = mix(vec3(1.0,0.15,0.55), vec3(0.20,0.75,1.0), t);
    c = mix(c, vec3(0.60,0.25,1.0), 0.5+0.5*sin(uTime*0.13 + n.y*2.6));
    col  = bg;
    col += c * pow(glow,1.7) * 0.13;               // outer halo
    col  = mix(col, c*0.9, edge);                  // colored core (not blown out)
    col += rim * c * 0.9;                           // neon rim
  }
  else if(uStyle==1){
    // CLASSIC LAVA LAMP — warm amber on deep maroon, soft
    vec3 bg = vec3(0.06,0.015,0.02);
    float t = 0.5 + 0.5*sin(uTime*0.12 + n.y*3.5);
    vec3 c = mix(vec3(0.92,0.24,0.05), vec3(1.0,0.58,0.10), t); // red→orange
    c = mix(c, vec3(1.0,0.80,0.30), smoothstep(1.2,2.4,f)*0.7); // gold cores
    col  = bg;
    col += c * pow(glow,1.4) * 0.09;
    col  = mix(col, c, smoothstep(0.78,1.06,f));
    col += rim * vec3(1.0,0.7,0.3) * 0.25;
  }
  else if(uStyle==2){
    // INK — single warm off-white blob on near-black, crisp gooey edge
    vec3 bg  = vec3(0.05,0.05,0.06);
    vec3 ink = vec3(0.94,0.93,0.9);
    float m = smoothstep(0.94,1.02,f);             // tight threshold = gooey
    col = mix(bg, ink, m);
  }
  else{
    // OIL SLICK — iridescent film, hue flows across surface + by field
    vec3 bg = vec3(0.02,0.03,0.05);
    float h = n.x*0.6 + n.y*0.5 + uTime*0.05 + f*0.015;
    vec3 c = hue(h);
    col  = bg;
    col += c * pow(glow,1.6) * 0.10;
    col  = mix(col, c*0.95, edge);
    col += rim * hue(h+0.4) * 0.8;                  // thin-film rim
  }

  // subtle vignette
  vec2 q = uv-0.5;
  col *= 1.0 - dot(q,q)*0.35;

  gl_FragColor = vec4(col,1.0);
}`;

function compile(type,src){
  const s = gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
    const log = gl.getShaderInfoLog(s);
    showError('Shader failed to compile on this device:\n' + log);
    throw new Error(log);
  }
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsrc));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsrc));
gl.linkProgram(prog); gl.useProgram(prog);
if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){
  showError('Shader program failed to link: ' + gl.getProgramInfoLog(prog));
  throw new Error('link failed');
}

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog,'pos');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

const U = n => gl.getUniformLocation(prog,n);
const uRes=U('uRes'), uTime=U('uTime'), uStyle=U('uStyle'),
      uBalls=U('uBalls'), uCount=U('uCount');
gl.uniform1i(uCount, COUNT);

// --- balls: slow drifting, gentle edge bounce ---
let aspect = 1;
const balls = [];
for(let i=0;i<COUNT;i++){
  const big = i<2;
  const a = Math.random()*6.2832;
  balls.push({
    x: Math.random(), y: Math.random(),
    vx: Math.cos(a), vy: Math.sin(a),          // unit velocity = constant speed
    r: big ? 0.09+Math.random()*0.03 : 0.045+Math.random()*0.03,
    spin: (Math.random()-0.5)*0.22,            // slow turn rate → organic wander
  });
}
const data = new Float32Array(MAX*3);

function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  canvas.width  = Math.floor(innerWidth*dpr);
  canvas.height = Math.floor(innerHeight*dpr);
  aspect = canvas.width/canvas.height;
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.uniform2f(uRes, canvas.width, canvas.height);
}
addEventListener('resize', resize); resize();

let last = performance.now();
const SPEED = 0.055;          // dreamy, but visibly moving
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;

function frame(now){
  const dt = Math.min((now-last)/1000, 0.05); last = now;
  const t = now/1000;

  for(let i=0;i<COUNT;i++){
    const b = balls[i];
    // gently rotate velocity → curved, organic wander at constant speed
    const ca = Math.cos(b.spin*dt), sa = Math.sin(b.spin*dt);
    const vx = b.vx*ca - b.vy*sa;
    b.vy = b.vx*sa + b.vy*ca; b.vx = vx;
    b.x += b.vx*SPEED*dt;
    b.y += b.vy*SPEED*dt;
    // perfectly elastic walls: reflect the component, speed preserved
    if(b.x<0.02){b.x=0.02;b.vx=Math.abs(b.vx);} if(b.x>0.98){b.x=0.98;b.vx=-Math.abs(b.vx);}
    if(b.y<0.02){b.y=0.02;b.vy=Math.abs(b.vy);} if(b.y>0.98){b.y=0.98;b.vy=-Math.abs(b.vy);}
    data[i*3]   = b.x*aspect;   // to aspect-space
    data[i*3+1] = b.y;
    data[i*3+2] = b.r;
  }
  gl.uniform3fv(uBalls, data);
  gl.uniform1f(uTime, reduce ? 0 : t);
  gl.uniform1i(uStyle, style);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
